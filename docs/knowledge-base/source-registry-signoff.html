<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库来源登记 · 签字页</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2933; --muted:#6b7280;
    --line:#e5e7eb; --soft:#f9fafb;
    --green:#0f766e; --green-bg:#ecfdf5;
    --amber:#b45309; --amber-bg:#fffbeb;
    --red:#b91c1c; --red-bg:#fef2f2;
    --blue:#1d4ed8; --blue-bg:#eff6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 22px 60px}
  header{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:.2px}
  .sub{color:var(--muted);margin:0;max-width:820px}
  .signbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:260px}
  .signbox label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .signbox input{border:1px solid #d1d5db;border-radius:8px;padding:7px 9px;font-size:14px;width:100%;background:#fff}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:26px;font-weight:700;line-height:1.1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:4px}
  .stat.green .n{color:var(--green)} .stat.amber .n{color:var(--amber)} .stat.red .n{color:var(--red)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.warn{background:#fff;border-color:#f59e0b;color:var(--amber)}
  .btn.ghost{background:transparent}
  .btn:hover{filter:brightness(.97)}
  .progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:4px 0 16px}
  .progress > i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 250px)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1120px}
  thead th{position:sticky;top:0;z-index:2;background:#fbfaf7;text-align:left;font-size:12px;color:var(--muted);
    font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:9px 10px;border-bottom:1px solid #f0efeb;vertical-align:top}
  tbody tr:hover{background:#fcfbf8}
  tbody tr.changed{background:var(--amber-bg)}
  tbody tr.signed{background:var(--green-bg)}
  tbody tr.decision td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
  tbody tr.decision{background:#fffdf5}
  .src{font-weight:650;font-size:13.5px;margin-bottom:2px}
  .meta{font-size:11.5px;color:var(--muted)}
  .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .badge{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .badge.pending{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
  .badge.decision{background:#fffbeb;color:#92400e;border-color:#fde68a}
  .badge.changed{background:#fef3c7;color:#92400e;border-color:#fcd34d}
  .badge.ok{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
  .badge.hold{background:#f3f4f6;color:#374151;border-color:#e5e7eb}
  select,input[type=text],input[list]{border:1px solid #d1d5db;border-radius:7px;padding:6px 7px;font-size:12.5px;background:#fff;color:var(--ink);max-width:100%}
  select:focus,input:focus{outline:2px solid #99f6e4;outline-offset:1px}
  .w-type{width:115px}.w-ver{width:145px}.w-scope{width:210px}.w-status{width:140px}.w-sign{width:105px}.w-note{width:160px}
  .counts{font-size:12px;color:var(--muted);white-space:nowrap}
  .footer{margin-top:14px;color:var(--muted);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
  .toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:none}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 12px 50px}h1{font-size:20px}.tablewrap{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>知识库来源登记 · 签字页</h1>
      <p class="sub">你只需要动四列：<b>来源类型、版本/年份、适用范围、状态</b>。不改就点“同意”；要改就先改下拉，签字会自动变“改后同意”。底部导出结果，发回即可。</p>
      <div class="legend">
        <span><i style="background:#fffbeb;border:1px solid #fde68a"></i>待拍板</span>
        <span><i style="background:#ecfdf5;border:1px solid #a7f3d0"></i>已签</span>
        <span><i style="background:#fef3c7;border:1px solid #fcd34d"></i>有改动</span>
        <span><i style="background:#f3f4f6;border:1px solid #e5e7eb"></i>待议</span>
      </div>
    </div>
    <div class="signbox">
      <label for="signer">签字人</label>
      <input id="signer" type="text" value="老板" autocomplete="off">
      <label for="signDate" style="margin-top:8px">签字日期</label>
      <input id="signDate" type="date">
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="nTotal">0</div><div class="l">来源总数</div></div>
    <div class="stat green"><div class="n" id="nSigned">0</div><div class="l">已签（同意 / 改后同意）</div></div>
    <div class="stat amber"><div class="n" id="nChanged">0</div><div class="l">有改动</div></div>
    <div class="stat red"><div class="n" id="nPending">0</div><div class="l">未签 / 待议</div></div>
  </div>
  <div class="progress"><i id="bar"></i></div>

  <div class="toolbar">
    <button class="chip active" data-filter="all">全部 <span class="counts" id="cAll"></span></button>
    <button class="chip" data-filter="unsigned">未签 <span class="counts" id="cUnsigned"></span></button>
    <button class="chip" data-filter="decision">待拍板 <span class="counts" id="cDecision"></span></button>
    <button class="chip" data-filter="pending">待核 <span class="counts" id="cPending"></span></button>
    <button class="chip" data-filter="changed">有改动 <span class="counts" id="cChanged"></span></button>
    <span style="flex:1"></span>
    <button class="btn primary" id="agreeRest">未签的全部同意</button>
    <button class="btn warn" id="reset">重置</button>
    <button class="btn" id="exportJson">导出签字结果</button>
    <button class="btn" id="exportCsv">导出 CSV</button>
    <button class="btn" id="copyResult">复制结果</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th style="min-width:250px">来源</th>
          <th>来源类型</th>
          <th>版本/年份</th>
          <th>适用范围</th>
          <th>状态</th>
          <th>文档 / 引用</th>
          <th>签字</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    <span>页面只在本机浏览器里，不会上传。导出 JSON 或 CSV 后发回即可。</span>
    <span>来源登记 v2：已取消证据等级 A/B/C；类型、年份、范围是事实，模型自己判断。</span>
  </div>
</div>
<div class="toast" id="toast"></div>

const DECISION_IDS = new Set([
  'AAHA-2014-WEIGHT','WSAVA-RENAL','AAHA-2010-NUTRITION-ASSESSMENT','AAHA-DIABETES-2018',
  'ASPCA-POISON','MERCK-DERM','AAHA-PAIN-2022','WSAVA-POSITION','CN-PET-FOOD-STD','WSAVA-VACC-2015'
]);
const PENDING_IDS = new Set([
  'CN-RABIES-TECH','WSAVA-RENAL','WSAVA-POSITION','WSAVA-HEREDITARY','MEYER-ZENTEK','KLEIN-ETAL','CN-PET-FOOD-STD'
]);
const TYPE_OPTIONS = ['指南','共识','教科书','标准','法规','参考手册','立场文件','内部笔记','单篇文献','毒物参考','指南/工具包'];
const STATUS_OPTIONS = ['在库','在库（待确认）','在库-待登记','在库-待映射','停用','待补','未归档','内部'];
const SIGN_OPTIONS = ['未签','同意','改后同意','待议'];
const STORAGE_KEY = 'kb-source-signoff-v2';

const state = DATA.map(d => ({
  ...d,
  orig: {type:d.type, version:d.version, scope:d.scope, status:d.status},
  sign: '未签',
  note: ''
}));
let filter = 'all';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isChanged(r){ return r.type!==r.orig.type || r.version!==r.orig.version || r.scope!==r.orig.scope || r.status!==r.orig.status; }
function signed(r){ return r.sign==='同意' || r.sign==='改后同意'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

function options(list, value){
  return list.map(v => `<option value="${esc(v)}"${v===value?' selected':''}>${esc(v)}</option>`).join('');
}
function scopeList(){
  const set = new Set(DATA.map(d=>d.scope));
  return [...set].sort((a,b)=>a.localeCompare(b,'zh'));
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      signer: $('signer').value, signDate: $('signDate').value,
      rows: state.map(r=>({id:r.id,type:r.type,version:r.version,scope:r.scope,status:r.status,sign:r.sign,note:r.note}))
    }));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.signer) $('signer').value = saved.signer;
    if(saved.signDate) $('signDate').value = saved.signDate;
    if(Array.isArray(saved.rows)){
      for(const s of saved.rows){
        const r = state.find(x=>x.id===s.id);
        if(!r) continue;
        r.type=s.type??r.type; r.version=s.version??r.version; r.scope=s.scope??r.scope; r.status=s.status??r.status;
        r.sign=s.sign??r.sign; r.note=s.note??r.note;
      }
    }
  }catch(e){}
}

function counts(){
  const total=state.length;
  const signedN=state.filter(signed).length;
  const changedN=state.filter(isChanged).length;
  const pendingN=state.filter(r=>!signed(r) || r.sign==='待议').length;
  return {total,signedN,changedN,pendingN};
}
function renderStats(){
  const c=counts();
  $('nTotal').textContent=c.total; $('nSigned').textContent=c.signedN;
  $('nChanged').textContent=c.changedN; $('nPending').textContent=c.pendingN;
  $('bar').style.width = (c.total? Math.round(c.signedN/c.total*100):0)+'%';
  $('cAll').textContent='('+c.total+')';
  $('cUnsigned').textContent='('+state.filter(r=>!signed(r)).length+')';
  $('cDecision').textContent='('+state.filter(r=>DECISION_IDS.has(r.id)).length+')';
  $('cPending').textContent='('+state.filter(r=>PENDING_IDS.has(r.id)).length+')';
  $('cChanged').textContent='('+c.changedN+')';
}

function rowHtml(r){
  const changed=isChanged(r);
  const cls=[changed?'changed':'',signed(r)?'signed':'',DECISION_IDS.has(r.id)?'decision':''].filter(Boolean).join(' ');
  const badges=[];
  if(DECISION_IDS.has(r.id)) badges.push('<span class="badge decision">待拍板</span>');
  if(PENDING_IDS.has(r.id) || /待核/.test(r.version)) badges.push('<span class="badge pending">待核</span>');
  if(changed) badges.push('<span class="badge changed">已改</span>');
  if(r.sign==='同意') badges.push('<span class="badge ok">同意</span>');
  if(r.sign==='改后同意') badges.push('<span class="badge changed">改后同意</span>');
  if(r.sign==='待议') badges.push('<span class="badge hold">待议</span>');
  return `<tr data-id="${esc(r.id)}" class="${cls}">
    <td>
      <div class="src">${esc(r.name)}</div>
      <div class="meta">${esc(r.org)} · ${esc(r.id)} · ${esc(r.species)}</div>
      ${r.supersedes?`<div class="meta">${esc(r.supersedes)}</div>`:''}
      <div class="badges">${badges.join('')}</div>
    </td>
    <td><select data-field="type" class="w-type">${options(TYPE_OPTIONS, r.type)}</select></td>
    <td><input data-field="version" class="w-ver" type="text" value="${esc(r.version)}" title="${esc(r.version)}" list="versionList"></td>
    <td><input data-field="scope" class="w-scope" type="text" value="${esc(r.scope)}" title="${esc(r.scope)}" list="scopeList"></td>
    <td><select data-field="status" class="w-status">${options(STATUS_OPTIONS, r.status)}</select></td>
    <td><div class="counts">${esc(r.docs)} 份 / ${esc(r.refs)} 处</div></td>
    <td><select data-field="sign" class="w-sign">${options(SIGN_OPTIONS, r.sign)}</select></td>
    <td><input data-field="note" class="w-note" type="text" value="${esc(r.note)}" title="${esc(r.note)}" placeholder="可留空"></td>
  </tr>`;
}

function visibleRows(){
  return state.filter(r=>{
    if(filter==='unsigned') return !signed(r);
    if(filter==='decision') return DECISION_IDS.has(r.id);
    if(filter==='pending') return PENDING_IDS.has(r.id) || /待核/.test(r.version);
    if(filter==='changed') return isChanged(r);
    return true;
  });
}
function renderTable(){
  const rows=visibleRows();
  $('tbody').innerHTML = rows.length ? rows.map(rowHtml).join('') : '<tr><td colspan="8"><div class="empty">这个筛选下没有来源。</div></td></tr>';
}
function render(){ renderStats(); renderTable(); save(); }

function update(id, field, value){
  const r=state.find(x=>x.id===id); if(!r) return;
  if(field==='sign'){ r.sign=value; }
  else {
    r[field]=value;
    const changed=isChanged(r);
    if(changed && (r.sign==='未签' || r.sign==='同意')) r.sign='改后同意';
    if(!changed && r.sign==='改后同意') r.sign='未签';
  }
  render();
}

function buildExport(){
  const c=counts();
  return {
    document:'source-registry-2026-11-02',
    signedBy: $('signer').value.trim() || '老板',
    signedAt: $('signDate').value,
    exportedAt: new Date().toISOString(),
    summary:{total:c.total, signed:c.signedN, changed:c.changedN, pending:c.pendingN},
    rows: state.map(r=>({
      sourceId:r.id, name:r.name,
      original:{type:r.orig.type, version:r.orig.version, scope:r.orig.scope, status:r.orig.status},
      signed:{type:r.type, version:r.version, scope:r.scope, status:r.status},
      conclusion:r.sign, changed:isChanged(r), note:r.note
    }))
  };
}
function download(name, text, mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function exportJson(){
  const d=buildExport();
  const name='source-registry-signoff-'+new Date().toISOString().slice(0,10)+'.json';
  download(name, JSON.stringify(d,null,2), 'application/json;charset=utf-8');
  toast('已导出 JSON，去“下载”文件夹找。');
}
function exportCsv(){
  const head=['来源ID','名称','来源类型','版本/年份','适用范围','状态','签字结论','是否改动','备注','签字人','签字日期'];
  const lines=[head.join(',')];
  for(const r of state){
    const vals=[r.id,r.name,r.type,r.version,r.scope,r.status,r.sign,isChanged(r)?'是':'否',r.note,$('signer').value.trim()||'老板',$('signDate').value];
    lines.push(vals.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
  }
  const name='source-registry-signoff-'+new Date().toISOString().slice(0,10)+'.csv';
  download(name, '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出 CSV，去“下载”文件夹找。');
}
async function copyResult(){
  const text=JSON.stringify(buildExport(),null,2);
  try{
    await navigator.clipboard.writeText(text);
    toast('已复制，直接粘贴即可。');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制，直接粘贴即可。'); }
    catch(err){ toast('复制失败，请用“导出 JSON”。'); }
    ta.remove();
  }
}

// init
const today=new Date();
$('signDate').value = today.toISOString().slice(0,10);
load();
if(!$('signer').value) $('signer').value='老板';
$('signer').addEventListener('change', save);
$('signDate').addEventListener('change', save);

document.querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter=btn.dataset.filter;
    renderTable();
  });
});
$('tbody').addEventListener('change', e=>{
  const tr=e.target.closest('tr'); if(!tr) return;
  const field=e.target.dataset.field; if(!field) return;
  update(tr.dataset.id, field, e.target.value);
});
$('agreeRest').addEventListener('click', ()=>{
  for(const r of state){ if(!signed(r) && r.sign!=='待议') r.sign = isChanged(r) ? '改后同意' : '同意'; }
  render();
  toast('未签的已经全部勾上；有改动的标为“改后同意”。');
});
$('reset').addEventListener('click', ()=>{
  if(!confirm('确定重置所有签字和改动？')) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
});
$('exportJson').addEventListener('click', exportJson);
$('exportCsv').addEventListener('click', exportCsv);
$('copyResult').addEventListener('click', copyResult);

// datalists
const dlScope=document.createElement('datalist'); dlScope.id='scopeList';
dlScope.innerHTML=scopeList().map(v=>`<option value="${esc(v)}"></option>`).join('');
document.body.appendChild(dlScope);
const dlVersion=document.createElement('datalist'); dlVersion.id='versionList';
dlVersion.innerHTML=[...new Set(DATA.map(d=>d.version))].sort().map(v=>`<option value="${esc(v)}"></option>`).join('');
document.body.appendChild(dlVersion);

render();
</script>
</body>
</html>
